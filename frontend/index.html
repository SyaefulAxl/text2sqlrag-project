<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>RAG Document Chatbot</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="header-content">
          <h1>📚 Document RAG Assistant</h1>
          <p class="subtitle">
            Ask questions about your documents and get detailed answers
          </p>
        </div>
      </header>

      <main class="main-content">
        <!-- Chat Area -->
        <div class="chat-container">
          <div
            class="messages"
            id="messagesContainer"
          ></div>

          <!-- Input Area -->
          <div class="input-area">
            <div class="input-wrapper">
              <input
                type="text"
                id="questionInput"
                class="input-field"
                placeholder="Ask a question about the documents..."
                autocomplete="off"
              />
              <button
                id="sendBtn"
                class="send-btn"
              >
                <span>Send</span>
                <span class="icon">→</span>
              </button>
            </div>
            <p class="input-hint">Press Enter or click Send</p>
          </div>
        </div>
      </main>
    </div>

    <!-- Response Modal for detailed view -->
    <div
      id="responseModal"
      class="modal"
    >
      <div class="modal-content">
        <button class="modal-close">&times;</button>
        <div
          class="modal-body"
          id="modalBody"
        ></div>
      </div>
    </div>

    <!-- Loading Spinner -->
    <div
      id="loadingSpinner"
      class="loading-spinner hidden"
    >
      <div class="spinner"></div>
      <p>Thinking...</p>
    </div>

    <!-- Markdown Parser (Marked.js) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
